# Infrastruktur proyek: database PostgreSQL + kerangka backend dan frontend.
# Semua nilai sensitif dibaca dari file .env (salinan dari .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: keuangan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Data disimpan di volume bernamed; init.sql jalan hanya saat volume kosong.
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend dan frontend akan diisi pada Langkah 2 dan Langkah 4.
  backend:
    build: ./backend
    container_name: keuangan-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Di dalam jaringan Compose, hostname database adalah "db".
      DB_HOST: db
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: keuangan-frontend
    restart: unless-stopped
    environment:
      # Proxy Vite di dalam container harus menunjuk ke service backend.
      PROXY_TARGET: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  db-data:
